<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#fafaf7;font-family:Geist,-apple-system,Segoe UI,Roboto,sans-serif;color:#0d0d12">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto">
      <tr><td style="font-family:Sora,Geist,sans-serif;font-weight:600;font-size:20px;letter-spacing:-0.02em;padding-bottom:24px">sondia</td></tr>
      <tr><td style="font-size:15px;line-height:1.5;padding-bottom:20px">Pulsa el botón para entrar en el ERP de SondIA. El enlace caduca en una hora y solo sirve una vez.</td></tr>
      <tr><td style="padding-bottom:24px">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
           style="display:inline-block;background:#ff6a1a;color:#0d0d12;font-weight:600;font-size:14px;text-decoration:none;padding:10px 16px;border-radius:6px">Entrar en el ERP</a>
      </td></tr>
      <tr><td style="font-size:13px;line-height:1.5;color:#5f5f69;padding-bottom:4px">¿Estás en otro dispositivo? Escribe este código en la pantalla de acceso:</td></tr>
      <tr><td style="font-family:'Geist Mono',ui-monospace,monospace;font-size:24px;letter-spacing:0.2em;padding-bottom:24px">{{ .Token }}</td></tr>
      <tr><td style="font-size:12px;color:#8b8b94">Si no has pedido este email, ignóralo.</td></tr>
    </table>
  </body>
</html>
